<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Domination</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="game-screen" style="display:flex">

    <!-- Top bar -->
    <div id="top-bar">
        <span id="turn-info">Turn <span id="turn-num">1</span> — <span id="cur-player-name">?</span>'s turn</span>
        <span id="phase-badge" class="phase-setup">Setup</span>
        <span id="armies-badge" style="display:none">Armies to place: <span id="armies-count">0</span></span>
        <button class="btn-warning btn-sm" id="end-attack-btn" style="display:none" onclick="sendEndAttack()">End Attacks</button>
        <button class="btn-secondary btn-sm" id="end-turn-btn" style="display:none" onclick="sendEndTurn()">End Turn</button>
    </div>

    <div id="main-area">
        <!-- Map -->
        <div id="map-container">
            <svg id="map-svg" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid meet"></svg>
        </div>

        <!-- Sidebar -->
        <div id="sidebar">
            <div id="player-list">
                <h3>Players</h3>
                <div id="players-container"></div>
            </div>
            <div id="continent-list">
                <h3>Continents</h3>
                <div id="continents-container"></div>
            </div>
            <div id="event-log">
                <h3>Log</h3>
                <div id="log-entries"></div>
            </div>
        </div>
    </div>
</div>

<!-- Army count modal -->
<div id="modal-overlay">
    <div id="modal-box">
        <h3 id="modal-title">Place Armies</h3>
        <p id="modal-desc"></p>
        <input type="number" id="modal-count" min="1" value="1">
        <div class="modal-btns">
            <button class="btn-primary" onclick="modalConfirm()">Confirm</button>
            <button class="btn-secondary" onclick="modalCancel()">Cancel</button>
        </div>
    </div>
</div>

<!-- Attack result popup -->
<div id="attack-popup">
    <h3>⚔️ Battle Result</h3>
    <div style="display:flex;justify-content:space-around;margin-bottom:8px">
        <div>
            <div style="font-size:0.75rem;color:#e74c3c;margin-bottom:4px">ATTACKER</div>
            <div class="dice-row" id="atk-dice-row"></div>
        </div>
        <div>
            <div style="font-size:0.75rem;color:#2980b9;margin-bottom:4px">DEFENDER</div>
            <div class="dice-row" id="def-dice-row"></div>
        </div>
    </div>
    <div class="result-text" id="attack-result-text"></div>
    <div class="capture-text" id="capture-text"></div>
    <button class="btn-primary btn-sm" style="margin-top:12px" onclick="dismissAttackPopup()">OK</button>
</div>

<!-- Win overlay -->
<div id="win-overlay">
    <h1>🏆 VICTORY!</h1>
    <p id="win-text"></p>
    <button class="btn-primary" onclick="window.location.href='index.html'">Back to Lobby</button>
</div>

<script src="js/territories.js"></script>
<script src="js/game.js"></script>
</body>
</html>
